name: aspire-backend-dev

services:
  api:
    container_name: aspire-backend-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env_dev
    environment:
      REDIS_URL: redis://aspire-backend-redis:6379/1
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      backend-shared:
        aliases:
          - dev-api

networks:
  backend-shared:
    external: true
    name: aspire-backend-shared
