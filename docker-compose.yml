name: aspire-backend-base

services:
  redis:
    image: redis:7-alpine
    container_name: aspire-backend-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend-shared

volumes:
  redis_data:
    name: aspire-backend-redis-data

networks:
  backend-shared:
    name: aspire-backend-shared
